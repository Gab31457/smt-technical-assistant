services:
  database:
    # PostgreSQL adatbazis pgvector kiegeszitessel.
    image: pgvector/pgvector:pg17

    # Az SMT projekthez tartozo kulon kontener.
    container_name: smt-assistant-postgres

    restart: unless-stopped

    environment:
      # Az SMT adatbazis felhasznaloneve.
      POSTGRES_USER: smt_user

      # A jelszot a .env fajlbol olvassa be.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

      # Az SMT projekthez tartozo adatbazis neve.
      POSTGRES_DB: smt_assistant

    ports:
      # Az uj projekt a Windows 5433-as portjat hasznalja.
      # A konteneren belul a PostgreSQL tovabbra is az 5432-es porton fut.
      - "5433:5432"

    volumes:
      # Kulon adattarolo az SMT projekt adatainak.
      - smt_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U smt_user -d smt_assistant"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  # Az SMT adatbazis tartos Docker volume-ja.
  smt_postgres_data: